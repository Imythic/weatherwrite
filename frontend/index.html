<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WeatherWrite — Daily Rain Muse</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>WeatherWrite — Daily Rain Muse</h1>
        <p class="subtitle">An always-on creative brief generated for you</p>
      </header>

      <article id="brief">
        <h2 id="headline">Loading…</h2>
        <img id="artwork" alt="Generated artwork for today's brief" hidden />
        <pre id="poem"></pre>
        <p id="prompt"></p>
        <p id="weather" class="muted"></p>
        <p id="generated_at" class="muted"></p>
      </article>

    </main>
    <script src="js/app.js"></script>
  </body>
</html>
